<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aicon — Bocetos del panel y CRM</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
    --white: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
      --white: #172033;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 1480px; margin: 32px auto; padding: 0 20px 40px; }
  h1 { margin: 0 0 6px; font-size: 25px; }
  p { margin: 0 0 24px; color: var(--muted); }
  .frame { overflow-x: auto; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
  svg { width: 1400px; height: auto; display: block; }
  .screen { fill: var(--white); stroke: var(--line); stroke-width: 1.5; rx: 14; }
  .sidebar, .bar, .placeholder { fill: var(--neutral); stroke: var(--line); stroke-width: 1; }
  .input { fill: var(--input); stroke: var(--line); stroke-width: 1; rx: 5; }
  .primary { fill: var(--process); stroke: var(--line); stroke-width: 1; rx: 5; }
  .success { fill: var(--storage); stroke: var(--line); stroke-width: 1; rx: 5; }
  .notice { fill: var(--external); stroke: var(--line); stroke-width: 1; rx: 5; }
  .risk { fill: var(--risk); stroke: var(--line); stroke-width: 1; rx: 5; }
  .title { font-size: 18px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 650; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .center { text-anchor: middle; }
  .line { stroke: var(--line); stroke-width: 1; fill: none; }
</style>
