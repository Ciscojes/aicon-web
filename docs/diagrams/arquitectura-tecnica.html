<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aicon — Arquitectura técnica</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
    --white: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
      --white: #172033;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 1120px; margin: 32px auto; padding: 0 20px 40px; }
  h1 { margin: 0 0 6px; font-size: 25px; }
  p { margin: 0 0 24px; color: var(--muted); }
  .frame { overflow-x: auto; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
  svg { width: 1040px; height: auto; display: block; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 7 5; rx: 16; }
  .node { stroke: var(--line); stroke-width: 1.2; rx: 12; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .edge { stroke: var(--line); stroke-width: 1.8; fill: none; }
  .title { font-size: 18px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 14px; font-weight: 650; fill: var(--fg); text-anchor: middle; }
  .small { font-size: 12px; fill: var(--muted); text-anchor: middle; }
  .zone-label { font-size: 12px; font-weight: 650; fill: var(--muted); }
  .edge-label { font-size: 11px; fill: var(--muted); text-anchor: middle; }
</style>
<main>
  <h1>Arquitectura propuesta: monolito modular</h1>
  <p>Aicon Edificadora S.A. · SPEC-013 · Propuesta en revisión</p>
  <div class="frame">
    <svg viewBox="0 0 1040 720" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">Arquitectura técnica propuesta para Aicon</title>
      <desc id="arch-desc">Compradores y personal usan una aplicación Next.js modular conectada a Supabase y a servicios externos de correo y WhatsApp.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
        </marker>
      </defs>

      <!-- Conectores -->
      <path class="edge" marker-end="url(#arrow)" d="M190 150 H300" />
      <path class="edge" marker-end="url(#arrow)" d="M190 290 H250 V170 H300" />
      <path class="edge" marker-end="url(#arrow)" d="M410 190 V230" />
      <path class="edge" marker-end="url(#arrow)" d="M410 330 V370" />
      <path class="edge" marker-end="url(#arrow)" d="M410 450 V490" />
      <path class="edge" marker-end="url(#arrow)" d="M520 410 H580 V220 H650" />
      <path class="edge" marker-end="url(#arrow)" d="M520 410 H600 V340 H650" />
      <path class="edge" marker-end="url(#arrow)" d="M520 410 H620 V445 H650" />
      <path class="edge" marker-end="url(#arrow)" d="M520 535 H560 V250 H650" />
      <path class="edge" marker-end="url(#arrow)" d="M520 535 H650 V610 H790" />
      <path class="edge" marker-end="url(#arrow)" d="M520 535 H610 V690 H880 V640 H905" />

      <!-- Zonas -->
      <rect class="zone" x="20" y="60" width="200" height="320" />
      <text class="zone-label" x="38" y="84">USUARIOS</text>
      <rect class="zone" x="270" y="60" width="280" height="540" />
      <text class="zone-label" x="288" y="84">APLICACIÓN NEXT.JS</text>
      <rect class="zone" x="620" y="60" width="250" height="500" />
      <text class="zone-label" x="638" y="84">SUPABASE ADMINISTRADO</text>
      <rect class="zone" x="770" y="580" width="250" height="120" />
      <text class="zone-label" x="788" y="602">SERVICIOS EXTERNOS</text>

      <!-- Usuarios -->
      <rect class="node input" x="50" y="110" width="140" height="80" />
      <text class="label" x="120" y="143">Comprador</text>
      <text class="small" x="120" y="166">Sitio público</text>
      <rect class="node input" x="50" y="250" width="140" height="80" />
      <text class="label" x="120" y="283">Dueño y asesor</text>
      <text class="small" x="120" y="306">Panel autenticado</text>

      <!-- Aplicación -->
      <rect class="node process" x="300" y="110" width="220" height="80" />
      <text class="label" x="410" y="143">Interfaz web</text>
      <text class="small" x="410" y="166">Pública + administrativa</text>
      <rect class="node process" x="300" y="230" width="220" height="100" />
      <text class="label" x="410" y="261">Módulos de negocio</text>
      <text class="small" x="410" y="286">Catálogo · CRM · Cotizaciones</text>
      <text class="small" x="410" y="306">Citas · Usuarios · Configuración</text>
      <rect class="node process" x="300" y="370" width="220" height="80" />
      <text class="label" x="410" y="403">Servidor y seguridad</text>
      <text class="small" x="410" y="426">Validación · permisos · auditoría</text>
      <rect class="node external" x="300" y="490" width="220" height="90" />
      <text class="label" x="410" y="524">Trabajos programados</text>
      <text class="small" x="410" y="548">Recordatorios · reintentos</text>
      <text class="small" x="410" y="566">procesamiento asíncrono</text>

      <!-- Supabase -->
      <rect class="node storage" x="650" y="170" width="190" height="100" />
      <text class="label" x="745" y="205">PostgreSQL</text>
      <text class="small" x="745" y="230">Propiedades · clientes</text>
      <text class="small" x="745" y="250">cotizaciones · citas</text>
      <rect class="node storage" x="650" y="305" width="190" height="70" />
      <text class="label" x="745" y="334">Autenticación</text>
      <text class="small" x="745" y="356">Roles y sesiones</text>
      <rect class="node storage" x="650" y="410" width="190" height="70" />
      <text class="label" x="745" y="439">Almacenamiento</text>
      <text class="small" x="745" y="461">Fotografías autorizadas</text>
      <rect class="node neutral" x="650" y="500" width="190" height="40" />
      <text class="small" x="745" y="524">Políticas de acceso y respaldo</text>

      <!-- Externos -->
      <rect class="node external" x="790" y="610" width="100" height="60" />
      <text class="label" x="840" y="637">Correo</text>
      <text class="small" x="840" y="656">Proveedor</text>
      <rect class="node external" x="905" y="610" width="100" height="60" />
      <text class="label" x="955" y="637">WhatsApp</text>
      <text class="small" x="955" y="656">API oficial</text>

      <!-- Etiquetas -->
      <text class="edge-label" x="245" y="139">HTTPS</text>
      <text class="edge-label" x="225" y="307">Sesión segura</text>
      <text class="edge-label" x="545" y="207">Datos</text>
      <text class="edge-label" x="615" y="329">Identidad</text>
      <text class="edge-label" x="636" y="432">Archivos</text>
    </svg>
  </div>
</main>
