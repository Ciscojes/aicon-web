<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aicon — Bocetos móviles</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --white: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --white: #172033;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 32px auto; padding: 0 20px 40px; }
  h1 { margin: 0 0 6px; font-size: 25px; }
  p { margin: 0 0 24px; color: var(--muted); }
  .frame { overflow-x: auto; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
  svg { width: 1020px; height: auto; display: block; }
  .phone { fill: var(--white); stroke: var(--line); stroke-width: 2; rx: 24; }
  .bar, .placeholder { fill: var(--neutral); stroke: var(--line); stroke-width: 1; }
  .input { fill: var(--input); stroke: var(--line); stroke-width: 1; rx: 7; }
  .primary { fill: var(--process); stroke: var(--line); stroke-width: 1; rx: 7; }
  .success { fill: var(--storage); stroke: var(--line); stroke-width: 1; rx: 7; }
  .notice { fill: var(--external); stroke: var(--line); stroke-width: 1; rx: 7; }
  .title { font-size: 17px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 650; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .center { text-anchor: middle; }
  .line { stroke: var(--line); stroke-width: 1; fill: none; }
</style>
<main>
  <h1>Bocetos móviles de baja fidelidad</h1>
  <p>Aicon Edificadora S.A. · SPEC-010 · Distribución en una columna y acciones táctiles.</p>
  <div class="frame">
    <svg viewBox="0 0 1020 1260" role="img" aria-labelledby="mobile-title mobile-desc">
      <title id="mobile-title">Seis bocetos móviles del recorrido público de Aicon</title>
      <desc id="mobile-desc">Portada, catálogo, detalle de casa, cotización, registro y calendario adaptados a una pantalla de celular.</desc>

      <!-- 1. Portada móvil -->
      <text class="title" x="44" y="30">1. Portada</text>
      <rect class="phone" x="20" y="48" width="300" height="550" />
      <rect class="bar" x="44" y="72" width="252" height="42" />
      <text class="label" x="60" y="98">AICON</text>
      <text class="label" x="269" y="98">☰</text>
      <rect class="placeholder" x="44" y="130" width="252" height="164" />
      <text class="small center" x="170" y="196">IMAGEN PROVISIONAL</text>
      <text class="label center" x="170" y="222">Construimos espacios</text>
      <text class="label center" x="170" y="241">para vivir tu futuro</text>
      <rect class="primary" x="44" y="310" width="252" height="44" />
      <text class="label center" x="170" y="337">Explorar casas</text>
      <rect class="input" x="44" y="366" width="252" height="44" />
      <text class="label center" x="170" y="393">Hablar con asesor</text>
      <rect class="input" x="44" y="426" width="252" height="54" />
      <text class="label" x="60" y="449">Buscar casas</text>
      <text class="small" x="60" y="468">Abrir filtros</text>
      <text class="label" x="44" y="510">Condominios destacados</text>
      <rect class="placeholder" x="44" y="526" width="118" height="48" />
      <rect class="placeholder" x="178" y="526" width="118" height="48" />

      <!-- 2. Catálogo móvil -->
      <text class="title" x="384" y="30">2. Catálogo</text>
      <rect class="phone" x="360" y="48" width="300" height="550" />
      <rect class="bar" x="384" y="72" width="252" height="42" />
      <text class="label" x="400" y="98">AICON</text>
      <text class="label" x="609" y="98">☰</text>
      <text class="label" x="384" y="148">Casas disponibles</text>
      <text class="small" x="384" y="168">12 resultados · Todos los condominios</text>
      <rect class="input" x="384" y="184" width="252" height="44" />
      <text class="label center" x="510" y="211">Filtros (0)</text>
      <rect class="placeholder" x="384" y="246" width="252" height="112" />
      <text class="label" x="384" y="384">Casa A-01 · $125,000</text>
      <text class="small" x="384" y="404">Los Robles · Disponible</text>
      <text class="small" x="384" y="422">3 hab · 2 baños · 2 estacionamientos</text>
      <rect class="primary" x="384" y="438" width="252" height="44" />
      <text class="label center" x="510" y="465">Ver casa</text>
      <rect class="placeholder" x="384" y="500" width="252" height="70" />

      <!-- 3. Detalle móvil -->
      <text class="title" x="724" y="30">3. Detalle de casa</text>
      <rect class="phone" x="700" y="48" width="300" height="550" />
      <rect class="bar" x="724" y="72" width="252" height="42" />
      <text class="small" x="740" y="98">← Volver</text>
      <rect class="placeholder" x="724" y="130" width="252" height="150" />
      <text class="small center" x="850" y="210">FOTO 1 / 8</text>
      <text class="label" x="724" y="310">Casa A-01</text>
      <text class="small" x="724" y="330">Condominio Los Robles</text>
      <text class="label" x="724" y="358">$125,000 · Disponible</text>
      <text class="small" x="724" y="380">3 hab · 2 baños · 2 estacionamientos</text>
      <text class="small" x="724" y="408">Descripción, áreas y acabados...</text>
      <rect class="input" x="724" y="430" width="252" height="38" />
      <text class="small center" x="850" y="454">Hablar con asesor</text>
      <rect class="bar" x="724" y="486" width="252" height="88" />
      <rect class="primary" x="736" y="508" width="108" height="44" />
      <rect class="success" x="856" y="508" width="108" height="44" />
      <text class="label center" x="790" y="535">Cotizar</text>
      <text class="label center" x="910" y="535">Agendar</text>

      <!-- 4. Cotización móvil -->
      <text class="title" x="44" y="640">4. Cotización</text>
      <rect class="phone" x="20" y="658" width="300" height="550" />
      <text class="label" x="44" y="700">Casa A-01 · $125,000</text>
      <text class="small" x="44" y="732">Prima</text>
      <rect class="input" x="44" y="742" width="252" height="44" />
      <text class="small" x="60" y="769">$12,500</text>
      <text class="small" x="44" y="814">Plazo</text>
      <rect class="input" x="44" y="824" width="252" height="44" />
      <text class="small" x="60" y="851">20 años</text>
      <text class="small" x="44" y="896">Tasa utilizada</text>
      <rect class="input" x="44" y="906" width="252" height="44" />
      <text class="small" x="60" y="933">Valor configurable</text>
      <rect class="notice" x="44" y="970" width="252" height="78" />
      <text class="label" x="60" y="998">Cuota estimada: $ —</text>
      <text class="small" x="60" y="1020">Resultado informativo.</text>
      <text class="small" x="60" y="1037">Condiciones sujetas al banco.</text>
      <rect class="primary" x="44" y="1066" width="252" height="44" />
      <text class="label center" x="170" y="1093">Solicitar cotización</text>
      <rect class="success" x="44" y="1122" width="252" height="44" />
      <text class="label center" x="170" y="1149">Agendar visita</text>

      <!-- 5. Registro móvil -->
      <text class="title" x="384" y="640">5. Registro</text>
      <rect class="phone" x="360" y="658" width="300" height="550" />
      <text class="label" x="384" y="700">Datos del interesado</text>
      <text class="small" x="384" y="732">Nombre *</text>
      <rect class="input" x="384" y="742" width="252" height="44" />
      <text class="small" x="384" y="814">Teléfono con código de país *</text>
      <rect class="input" x="384" y="824" width="252" height="44" />
      <text class="small" x="384" y="896">Correo para agenda y avisos</text>
      <rect class="input" x="384" y="906" width="252" height="44" />
      <rect class="input" x="384" y="978" width="26" height="26" />
      <text class="small" x="422" y="990">Acepto recibir avisos sobre</text>
      <text class="small" x="422" y="1007">mi solicitud y mi cita.</text>
      <rect class="notice" x="384" y="1034" width="252" height="48" />
      <text class="small" x="400" y="1054">Casa A-01</text>
      <text class="small" x="400" y="1070">Los datos se reutilizarán.</text>
      <rect class="primary" x="384" y="1100" width="252" height="48" />
      <text class="label center" x="510" y="1129">Continuar</text>

      <!-- 6. Calendario móvil -->
      <text class="title" x="724" y="640">6. Calendario</text>
      <rect class="phone" x="700" y="658" width="300" height="550" />
      <rect class="notice" x="724" y="686" width="252" height="60" />
      <text class="label" x="740" y="710">Casa A-01</text>
      <text class="small" x="740" y="730">Visita de 60 minutos</text>
      <text class="small" x="724" y="778">Seleccione una fecha</text>
      <rect class="input" x="724" y="790" width="252" height="82" />
      <text class="small center" x="850" y="818">Lun 12 · Mar 13 · Mié 14</text>
      <text class="label center" x="850" y="848">Jue 15 · Vie 16 · Sáb 17</text>
      <text class="small" x="724" y="904">Horarios disponibles</text>
      <rect class="input" x="724" y="916" width="76" height="44" />
      <rect class="success" x="812" y="916" width="76" height="44" />
      <rect class="input" x="900" y="916" width="76" height="44" />
      <text class="small center" x="762" y="943">9:00</text>
      <text class="small center" x="850" y="943">10:30</text>
      <text class="small center" x="938" y="943">1:00</text>
      <rect class="notice" x="724" y="982" width="252" height="72" />
      <text class="small" x="740" y="1004">Jueves 15 · 10:30 a. m.</text>
      <text class="small" x="740" y="1023">Correo + WhatsApp</text>
      <text class="small" x="740" y="1042">Avisos 24 h y 2 h antes</text>
      <rect class="primary" x="724" y="1072" width="252" height="48" />
      <text class="label center" x="850" y="1101">Confirmar visita</text>
      <text class="small center" x="850" y="1156">Cancelar o solicitar reprogramación</text>
    </svg>
  </div>
</main>
