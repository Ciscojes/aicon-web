name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Security gates
        run: npm run security -- --report .agent/ci/security-report.json
      - name: Upload sanitized security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report-${{ github.run_id }}
          path: .agent/ci/security-report.json
          if-no-files-found: error
          retention-days: 14
